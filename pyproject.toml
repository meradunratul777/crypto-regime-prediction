[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-regime-detection"
version = "1.0.0"
description = "Four-hour crypto regime classification with leakage-aware lookback benchmarks"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3",
  "scikit-learn==1.6.1", "lightgbm==4.6.0", "joblib==1.5.0",
  "pyarrow==20.0.0", "matplotlib==3.10.3"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
crypto-regime = "regime_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
